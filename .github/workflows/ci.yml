name: Offline regression checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  tests:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q criclytics_app scripts tools app.py wsgi.py
      - run: python -m scripts.build_frontend
      - run: python -m scripts.stage_backend
      - name: Frontend JavaScript syntax
        run: find criclytics_app/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Offline browser interactions (one matrix job)
        if: matrix.python == '3.12'
        run: |
          python -m pip install -r tools/browser-requirements.txt
          python -m playwright install --with-deps chromium
          python -m tools.browser_audit --channel chromium
          python -m tools.browser_security --channel chromium
