name: Release backend to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test offline contracts
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Audit release dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Stage public backend files
        run: python -m scripts.stage_backend
      - name: Upload allowlisted artifact
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface_hub==2.3.0
          python -m scripts.verify_backend_inventory --repo aliamirchoudhary/criclytics-backend
          hf upload aliamirchoudhary/criclytics-backend build/backend . --repo-type space
